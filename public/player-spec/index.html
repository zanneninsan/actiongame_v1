<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Spec - SUPER ZANNENIN=SAN LAND</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10131a;
        --panel: #171d26;
        --panel-alt: #202631;
        --line: #3e4a5c;
        --text: #f8fafc;
        --muted: #aeb9c8;
        --gold: #f5c76a;
        --mint: #8cffd2;
        --rose: #f4a6b8;
        --blue: #8fb7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          linear-gradient(180deg, rgba(20, 24, 32, 0.96), rgba(12, 15, 22, 0.98)),
          var(--bg);
        color: var(--text);
        font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
        line-height: 1.72;
      }

      a {
        color: var(--mint);
      }

      .page-shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 64px;
      }

      header {
        padding: 24px 0 30px;
        border-bottom: 1px solid var(--line);
      }

      .kicker {
        margin: 0 0 8px;
        color: var(--gold);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 36px;
        line-height: 1.18;
      }

      .lead {
        max-width: 780px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 16px;
      }

      .language-switch {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0 0;
      }

      .language-switch button {
        min-height: 34px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #1b2230;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }

      .language-switch button[aria-pressed="true"] {
        border-color: var(--gold);
        color: var(--gold);
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 24px 0 0;
      }

      nav a,
      .back-link {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #1b2230;
        color: var(--text);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      main {
        display: grid;
        gap: 34px;
        margin-top: 34px;
      }

      h2 {
        margin: 0 0 12px;
        color: var(--gold);
        font-size: 24px;
        line-height: 1.3;
      }

      h3 {
        margin: 22px 0 8px;
        color: var(--mint);
        font-size: 18px;
      }

      p {
        margin: 0 0 12px;
      }

      .spec-note {
        color: var(--muted);
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }

      table {
        width: 100%;
        min-width: 680px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        background: var(--panel-alt);
        color: var(--gold);
        font-size: 13px;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      td.num,
      th.num {
        text-align: right;
        white-space: nowrap;
      }

      code,
      pre {
        font-family: "Cascadia Mono", Consolas, monospace;
      }

      code {
        color: var(--rose);
      }

      pre {
        overflow-x: auto;
        margin: 12px 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0b0f16;
      }

      .rule-list {
        margin: 0;
        padding-left: 22px;
      }

      .rule-list li + li {
        margin-top: 6px;
      }

      .callout {
        border-left: 4px solid var(--blue);
        padding: 12px 16px;
        background: rgba(143, 183, 255, 0.11);
      }

      footer {
        margin-top: 46px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .page-shell {
          width: min(100% - 22px, 1120px);
          padding-top: 24px;
        }

        h1 {
          font-size: 28px;
        }

        nav a,
        .back-link {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>

    <div class="page-shell">
      <header>
        <p class="kicker" data-i18n="kicker"></p>

        <p class="lead" data-i18n="lead"></p>

          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="ko">한국어</button>

        <nav aria-label="Page sections">
          <a href="#score" data-i18n="navScore"></a>
          <a href="#controls" data-i18n="navControls"></a>
          <a href="#stomp-combo" data-i18n="navCombo"></a>
          <a href="#powerups" data-i18n="navPowerups"></a>
          <a href="#clear-rank" data-i18n="navRank"></a>
          <a href="#missions" data-i18n="navMissions"></a>
          <a class="back-link" href="../" data-i18n="navBack"></a>
        </nav>
      </header>

      <main>
        <section id="status">
          <h2 data-i18n="statusTitle"></h2>
          <p class="spec-note"><span data-i18n="updatedLabel"></span> <code data-spec-version></code></p>
          <div class="callout">
            <p><strong data-i18n="calloutStompTitle"></strong> <span data-i18n="calloutStompBody"></span></p>
            <p><strong data-i18n="calloutComboTitle"></strong> <span data-i18n="calloutComboBody"></span></p>
          </div>
        </section>

        <section id="score">
          <h2 data-i18n="scoreTitle"></h2>
          <h3 data-i18n="itemsTitle"></h3>
          <div class="table-wrap">
            <table>
              <thead data-table-head="items"></thead>
              <tbody data-table-body="items"></tbody>
            </table>
          </div>

          <h3 data-i18n="enemyTitle"></h3>
          <p data-i18n="enemyBody"></p>
          <div class="table-wrap">
            <table>
              <thead data-table-head="enemies"></thead>
              <tbody data-table-body="enemies"></tbody>
            </table>
          </div>
        </section>

        <section id="controls">
          <h2 data-i18n="controlsTitle"></h2>
          <p data-i18n="controlsLead"></p>
          <ul class="rule-list" data-list="controlsRules"></ul>
        </section>

        <section id="stomp-combo">
          <h2 data-i18n="comboTitle"></h2>
          <p data-i18n="comboLead"></p>
          <h3 data-i18n="comboConditionTitle"></h3>
          <ul class="rule-list" data-list="comboRules"></ul>
          <h3 data-i18n="scoreFormulaTitle"></h3>
          <pre><code data-i18n="scoreFormula"></code></pre>
          <div class="table-wrap">
            <table>
              <thead data-table-head="comboExamples"></thead>
              <tbody data-table-body="comboExamples"></tbody>
            </table>
          </div>
          <h3 data-i18n="popupTitle"></h3>
          <ul class="rule-list" data-list="popupRules"></ul>
        </section>

        <section id="powerups">
          <h2 data-i18n="powerupsTitle"></h2>
          <div class="table-wrap">
            <table>
              <thead data-table-head="powerups"></thead>
              <tbody data-table-body="powerups"></tbody>
            </table>
          </div>
        </section>

        <section id="clear-rank">
          <h2 data-i18n="rankTitle"></h2>
          <p data-i18n="rankLead"></p>
          <div class="table-wrap">
            <table>
              <thead data-table-head="rankBonuses"></thead>
              <tbody data-table-body="rankBonuses"></tbody>
            </table>
          </div>

          <h3 data-i18n="rankThresholdTitle"></h3>
          <div class="table-wrap">
            <table>
              <thead data-table-head="rankThresholds"></thead>
              <tbody data-table-body="rankThresholds"></tbody>
            </table>
          </div>
        </section>

        <section id="missions">
          <h2 data-i18n="missionsTitle"></h2>
          <p data-i18n="missionsLead"></p>
          <ul class="rule-list" data-list="missions"></ul>
        </section>
      </main>

      <footer>
        <p data-i18n="footer"></p>
      </footer>
    </div>

      function clearChildren(element) {
        while (element.firstChild) {
          element.removeChild(element.firstChild);
        }
      }

      function renderList(name, rows) {
        const list = document.querySelector(`[data-list="${name}"]`);
        if (!list) return;
        clearChildren(list);
        rows.forEach((row) => {
          const li = document.createElement("li");
          if (Array.isArray(row)) {
            li.append(`${row[0]}: `);
            const code = document.createElement("code");
            code.textContent = row[1];
            li.append(code);
          } else {
            li.textContent = row;
          }
          list.append(li);
        });
      }

      function renderTable(name, table) {
        const head = document.querySelector(`[data-table-head="${name}"]`);
        const body = document.querySelector(`[data-table-body="${name}"]`);
        if (!head || !body) return;
        clearChildren(head);
        clearChildren(body);

        const headerRow = document.createElement("tr");
        table.heads.forEach((label, index) => {
          const th = document.createElement("th");
          th.textContent = label;
          if (table.numeric.includes(index)) th.className = "num";
          headerRow.append(th);
        });
        head.append(headerRow);

        table.rows.forEach((row) => {
          const tr = document.createElement("tr");
          row.forEach((value, index) => {
            const td = document.createElement("td");
            td.textContent = value;
            if (table.numeric.includes(index)) td.className = "num";
            tr.append(td);
          });
          body.append(tr);
        });
      }

      function normalizeLocale(value) {
        const normalized = value ? value.toLowerCase() : "";
        if (normalized.startsWith("zh")) return "zh";
        if (normalized.startsWith("ko")) return "ko";
        if (normalized.startsWith("ja")) return "ja";
        return "en";
      }

      function isSupportedLocale(value) {
        return value === "ja" || value === "en" || value === "zh" || value === "ko";
      }

      function getInitialLocale() {
        const params = new URLSearchParams(window.location.search);
        const queryLocale = params.get("lang");
        if (isSupportedLocale(queryLocale)) return queryLocale;

        try {
          const storedLocale = window.localStorage.getItem(STORAGE_KEY);
          if (isSupportedLocale(storedLocale)) return storedLocale;
        } catch {
          // Local storage can be blocked in some embedded browsers.
        }

        return normalizeLocale(window.navigator.language);
      }

      function setLanguage(locale) {
        const text = specText[locale] ?? specText.ja;
        document.documentElement.lang = locale;
        document.title = text.metaTitle;

        document.querySelectorAll("[data-i18n]").forEach((element) => {
          const key = element.getAttribute("data-i18n");
          element.textContent = text[key] ?? "";
        });
        document.querySelectorAll("[data-spec-version]").forEach((element) => {
          element.textContent = SPEC_VERSION;
        });
        Object.entries(text.tables).forEach(([name, table]) => renderTable(name, table));
        renderList("comboRules", text.comboRules);
        renderList("popupRules", text.popupRules);
        renderList("controlsRules", text.controlsRules);
        renderList("missions", text.missions);

        document.querySelectorAll("[data-lang]").forEach((button) => {
          const isActive = button.getAttribute("data-lang") === locale;
          button.setAttribute("aria-pressed", String(isActive));
        });

        try {
          window.localStorage.setItem(STORAGE_KEY, locale);
        } catch {
          // Local storage can be blocked in some embedded browsers.
        }
      }

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => {
          const locale = button.getAttribute("data-lang");
          if (isSupportedLocale(locale)) {
            setLanguage(locale);
          }
        });
      });

      setLanguage(getInitialLocale());
